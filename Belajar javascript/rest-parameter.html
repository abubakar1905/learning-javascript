<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    function sum(name, nama, ...data){
        let total =0;
        for(const item of data){
            total += item;
        }
        document.writeln(`<p> total ${name} & ${nama} is ${total} </p>`)
    }
    sum('anggur','strawberry', 10,20,40,76,12);

    const values = [10,10,10,10];

    sum('apel','mangga', ...values);
</script>
</body>
</html>
