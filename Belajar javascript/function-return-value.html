<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    function sayHello(firstName, lastName){
        const say = `hello ${firstName} ${lastName}`
        return say;             //ini otomatis akan mengisi ke const result yang di bawah
    }
    const isiDariSay = sayHello('eko', 'khanedy');      //variabel ini bebas isinya yang intinya bakal ngambil return si say nya.
    document.writeln(`<p>${isiDariSay}</p>`);

    //return value bisa lebih dari satu.
    function getFinalScore(value){
        if(value > 90){
            return 'A';
        }
        else if(value > 80){
            return 'B';
        }else if(value > 70){
            return 'C';
        }
        else{
            return 'D';
        }
    }
    const finalValue = getFinalScore(100);
    document.writeln(`<p>${finalValue}</p>`)
</script>
</body>
</html>
